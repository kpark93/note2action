services:
  api:
    build:
      context: ./apps/api
    ports:
      # Container listens on 8000 internally; host port is 8001 (8000 belongs
      # to other local projects).
      - "8001:8000"
    environment:
      # In-network hostnames — .env's localhost URLs don't resolve inside a
      # container, so these override the env_file values below.
      - DATABASE_URL=postgresql+psycopg://note2action_app:note2action_app_dev@postgres:5432/note2action
      - MIGRATIONS_DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/note2action
      - REPOSITORY=postgres
    # CLERK_JWKS_URL comes from the local gitignored .env. First boot of a
    # fresh database still needs migrations:
    #   docker compose exec api uv run alembic upgrade head
    env_file:
      - path: apps/api/.env
        required: false
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      # In Compose, /api/* -> the `api` service and /ai-api/* -> the `ai`
      # service (not localhost).
      - VITE_API_PROXY_TARGET=http://api:8000
      - VITE_AI_PROXY_TARGET=http://ai:3000
    depends_on:
      - api
      - ai

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
      # The image's final stage is prod; local compose wants the dev server.
      target: dev
    ports:
      - "3000:3000"
    # Loads ANTHROPIC_API_KEY (and optional CHAT_MODEL). Optional so the stack
    # still starts without it — chat just won't work until you add the key.
    env_file:
      - path: apps/ai/.env
        required: false

  postgres:
    image: postgres:17.1-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=note2action
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
