services:
  api:
    build:
      context: ./apps/api
    ports:
      # Container listens on 8000 internally; host port is 8001 (8000 belongs
      # to other local projects).
      - "8001:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      # In Compose, /api/* -> the `api` service and /ai-api/* -> the `ai`
      # service (not localhost).
      - VITE_API_PROXY_TARGET=http://api:8000
      - VITE_AI_PROXY_TARGET=http://ai:3000
    depends_on:
      - api
      - ai

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    ports:
      - "3000:3000"
    # Loads ANTHROPIC_API_KEY (and optional CHAT_MODEL). Optional so the stack
    # still starts without it — chat just won't work until you add the key.
    env_file:
      - path: apps/ai/.env
        required: false

  postgres:
    image: postgres:17.1-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=note2action
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
