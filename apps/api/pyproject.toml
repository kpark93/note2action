[project]
name = "note2action-api"
version = "0.0.0"
description = "note2action FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.16.4",
]

# This is an application, not a distributable package — don't build/install it.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: hits a real Postgres — run with: pytest -m integration",
]
# Plain `pytest` runs only the fast in-memory suite; integration tests are
# opt-in (`pytest -m integration`) because they need Postgres running.
addopts = "-m 'not integration'"
