[project]
name = "note2action"
version = "0.0.0"
requires-python = ">=3.10"

# Workspace root — config and tooling only, not a distributable package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # ruff defaults
    "I",    # import sorting — auto-fixed
    "UP",   # pyupgrade — auto-fixed
    "B",    # bugbear — mostly report-only
    "SIM",  # simplify — often auto-fixed
    "RUF",  # ruff-specific — often auto-fixed
]
ignore = [
    "E501",  # formatter owns line length
]

[tool.ruff.lint.per-file-ignores]
"apps/api/migrations/env.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Path",
]

[tool.ruff.format]
docstring-code-format = true